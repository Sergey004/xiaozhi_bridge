<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XiaoZhi Server</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f1117;--card:#1a1d27;--border:#2a2d3a;--text:#e1e4ed;--dim:#6b7280;--accent:#6366f1;--green:#22c55e;--red:#ef4444;--yellow:#eab308;--blue:#3b82f6;--purple:#a855f7}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:20px;font-weight:600}.header h1 span{color:var(--accent)}
.header-right{display:flex;align-items:center;gap:16px;font-size:13px;color:var(--dim)}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.status-dot.on{background:var(--green)}.status-dot.off{background:var(--red)}.status-dot.warn{background:var(--yellow)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;padding:20px 24px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
.card h3{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin-bottom:6px}
.card .value{font-size:24px;font-weight:700}.card .sub{font-size:11px;color:var(--dim);margin-top:4px;line-height:1.4}
.main{display:grid;grid-template-columns:1fr 1fr;gap:0;height:calc(100vh - 230px)}
.panel{background:var(--card);border:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.panel-header{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;flex-shrink:0}
.panel-body{flex:1;overflow-y:auto;padding:10px 16px}
.panel-body::-webkit-scrollbar{width:6px}.panel-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.msg{padding:8px 12px;border-radius:8px;font-size:13px;max-width:85%;word-break:break-word;margin-bottom:4px}
.msg.user{background:var(--accent);color:#fff;align-self:flex-end;border-bottom-right-radius:2px}
.msg.assistant{background:#252836;color:var(--text);align-self:flex-start;border-bottom-left-radius:2px}
.msg.system{background:transparent;color:var(--dim);align-self:center;font-size:11px;font-style:italic}
.chat-messages{display:flex;flex-direction:column;gap:4px}
.chat-input{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--border);flex-shrink:0}
.chat-input input{flex:1;background:#252836;border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:13px;outline:none}
.chat-input input:focus{border-color:var(--accent)}
.chat-input button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:13px;cursor:pointer;font-weight:500}
.chat-input button:hover{opacity:.9}.chat-input button:disabled{opacity:.4;cursor:not-allowed}
.log-entry{font-family:'SF Mono',Consolas,monospace;font-size:11px;line-height:1.5;padding:1px 0;border-bottom:1px solid #1a1d27}
.log-entry .time{color:var(--dim)}.log-entry .INFO{color:var(--green)}.log-entry .WARNING{color:var(--yellow)}.log-entry .ERROR{color:var(--red)}
.device{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.device:last-child{border-bottom:none}.device-info{display:flex;align-items:center;gap:10px}
.device-mac{font-family:monospace;font-size:13px}
.device-status{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:500}
.device-status.connected{background:#22c55e22;color:var(--green)}
.device-status.offline{background:#6b728022;color:var(--dim)}
.config-item{display:flex;justify-content:space-between;padding:5px 0;font-size:12px;border-bottom:1px solid #1a1d27}
.config-key{color:var(--dim);font-family:monospace;font-size:11px}
.config-val{color:var(--text);font-family:monospace;text-align:right;max-width:60%;overflow:hidden;text-overflow:ellipsis;font-size:11px}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);padding:0 16px;flex-shrink:0}
.tab{padding:8px 14px;font-size:11px;font-weight:500;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.tab:hover{color:var(--text)}.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-content{display:none}.tab-content.active{display:flex;flex-direction:column;height:100%}
.badge{display:inline-block;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:600;margin-left:6px}
.badge.on{background:#22c55e22;color:var(--green)}.badge.off{background:#6b728022;color:var(--dim)}.badge.warn{background:#eab30822;color:var(--yellow)}
.tool-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #1a1d27;font-size:12px}
.tool-name{font-family:monospace;color:var(--accent);font-weight:500}
.tool-desc{color:var(--dim)}
@media(max-width:900px){.main{grid-template-columns:1fr;height:auto}.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<div class="header">
  <h1><span>XiaoZhi</span> Server <span style="font-size:12px;color:var(--dim);font-weight:400">v2.0</span></h1>
  <div class="header-right">
    <span><span class="status-dot on"></span>WS :8765</span>
    <span><span class="status-dot on"></span>HTTP :8000</span>
    <span id="uptime"></span>
  </div>
</div>

<div class="grid" id="cards"></div>

<div class="main">
  <div class="panel">
    <div class="panel-header">
      <span>Chat Test</span>
      <button onclick="clearChat()" style="background:none;border:1px solid var(--border);color:var(--dim);border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer">Clear</button>
    </div>
    <div class="panel-body" id="chat-box">
      <div class="chat-messages" id="chat-messages">
        <div class="msg system">Type a message to test LLM</div>
      </div>
    </div>
    <div class="chat-input">
      <input id="chat-input" placeholder="Type message..." onkeydown="if(event.key==='Enter')sendChat()">
      <button onclick="sendChat()" id="chat-send">Send</button>
    </div>
  </div>

  <div class="panel">
    <div class="tabs">
      <div class="tab active" onclick="switchTab(this,'tab-logs')">Logs</div>
      <div class="tab" onclick="switchTab(this,'tab-devices')">Devices</div>
      <div class="tab" onclick="switchTab(this,'tab-config')">Config</div>
      <div class="tab" onclick="switchTab(this,'tab-tools')">Tools</div>
    </div>

    <div class="tab-content active" id="tab-logs">
      <div class="panel-header">
        <span>Real-time Logs</span>
        <label style="font-size:11px;color:var(--dim);cursor:pointer"><input type="checkbox" id="log-auto" checked style="margin-right:4px">Auto-scroll</label>
      </div>
      <div class="panel-body" id="log-box"></div>
    </div>

    <div class="tab-content" id="tab-devices">
      <div class="panel-header"><span>Connected Devices</span><span id="dev-count-header">0</span></div>
      <div class="panel-body" id="device-list"><div style="color:var(--dim);font-size:12px;padding:20px;text-align:center">No devices connected yet</div></div>
    </div>

    <div class="tab-content" id="tab-config">
      <div class="panel-header"><span>Server Configuration</span></div>
      <div class="panel-body" id="config-list"></div>
    </div>

    <div class="tab-content" id="tab-tools">
      <div class="panel-header"><span>Registered Tools</span><span id="tool-count">0</span></div>
      <div class="panel-body" id="tool-list"></div>
    </div>
  </div>
</div>

<script>
const API='';
let logWs=null;
const startTime=Date.now();

function uptime(){
  const d=Math.floor((Date.now()-startTime)/1000);
  const h=Math.floor(d/3600),m=Math.floor((d%3600)/60),s=d%60;
  return `${h}h ${m}m ${s}s`;
}

// ─── Health ───
async function fetchHealth(){
  try{
    const r=await fetch(API+'/health');
    const d=await r.json();
    const comp=d.components||{};
    const feat=d.features||{};
    const cards=[
      {h:'STT (Whisper)',v:comp.stt==='ready'?'Ready':'Offline',c:comp.stt==='ready'?'var(--green)':'var(--red)',s:d.config?`${d.config.whisper_model} / ${d.config.whisper_device}`:''},
      {h:`TTS (${feat.tts_engine||'turbo'})`,v:comp.tts==='ready'?'Ready':'Offline',c:comp.tts==='ready'?'var(--green)':'var(--red)',s:d.config?`${feat.tts_engine} / ${d.config.tts_device}`:''},
      {h:'LLM',v:comp.llm==='ready'?'Ready':'Offline',c:comp.llm==='ready'?'var(--green)':'var(--red)',s:d.llm?`${d.llm.provider} ${d.llm.model||''}`:''},
      {h:'Devices',v:d.connected_devices||'0',c:'var(--text)',s:'connected'},
      {h:'Tools',v:d.features?.tools_enabled?'ON':'OFF',c:d.features?.tools_enabled?'var(--green)':'var(--dim)',s:`${d.tools_count||0} registered (${feat.tool_call_mode||'off'})`},
      {h:'Memory',v:feat.memory_enabled?'ON':'OFF',c:feat.memory_enabled?'var(--green)':'var(--dim)',s:feat.memory_enabled?'Local short-term':'Disabled'},
      {h:'Streaming',v:feat.tts_streaming?'ON':'OFF',c:feat.tts_streaming?'var(--green)':'var(--dim)',s:'Sentence-by-sentence TTS'},
      {h:'Features',v:'Active',c:'var(--purple)',s:[
        feat.end_prompt?'End-prompt':'', 
        d.config?.EXIT_COMMANDS?.length?`Exit: ${d.config.EXIT_COMMANDS.join(', ')}`:'',
        'HMAC tokens'
      ].filter(Boolean).join(' | ')},
    ];
    document.getElementById('cards').innerHTML=cards.map(c=>`
      <div class="card">
        <h3>${c.h}</h3>
        <div class="value" style="color:${c.c}">${c.v}</div>
        <div class="sub">${c.s}</div>
      </div>
    `).join('');
    document.getElementById('uptime').textContent='uptime: '+uptime();
  }catch(e){
    document.getElementById('cards').innerHTML='<div class="card" style="grid-column:1/-1"><h3>Server</h3><div class="value" style="color:var(--red)">Offline</div></div>';
  }
}

// ─── Chat ───
async function sendChat(){
  const input=document.getElementById('chat-input');
  const text=input.value.trim();
  if(!text)return;
  input.value='';
  addMsg('user',text);
  const btn=document.getElementById('chat-send');
  btn.disabled=true;
  try{
    const r=await fetch(API+'/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:text}],max_tokens:1024})});
    const d=await r.json();
    if(d.choices&&d.choices[0])addMsg('assistant',d.choices[0].message.content);
    else addMsg('system','Error: no response');
  }catch(e){addMsg('system','Error: '+e.message)}
  btn.disabled=false;
  input.focus();
}
function addMsg(role,text){
  const box=document.getElementById('chat-messages');
  const div=document.createElement('div');
  div.className='msg '+role;
  div.textContent=text;
  box.appendChild(div);
  document.getElementById('chat-box').scrollTop=document.getElementById('chat-box').scrollHeight;
}
function clearChat(){document.getElementById('chat-messages').innerHTML='<div class="msg system">Chat cleared</div>'}

// ─── Logs SSE ───
function connectLogs(){
  if(logWs)logWs.close();
  logWs=new EventSource(API+'/logs/stream');
  logWs.onmessage=function(e){
    const box=document.getElementById('log-box');
    const d=document.createElement('div');
    d.className='log-entry';
    d.innerHTML=e.data.replace(/(\d{2}\/\d{2}\/\d{2}\s+\d{2}:\d{2}:\d{2})/g,'<span class="time">$1</span>')
      .replace(/\b(INFO|DEBUG)\b/g,'<span class="INFO">$1</span>')
      .replace(/\b(WARNING)\b/g,'<span class="WARNING">$1</span>')
      .replace(/\b(ERROR|CRITICAL)\b/g,'<span class="ERROR">$1</span>');
    box.appendChild(d);
    while(box.children.length>500)box.removeChild(box.firstChild);
    if(document.getElementById('log-auto').checked)box.scrollTop=box.scrollHeight;
  };
  logWs.onerror=function(){setTimeout(connectLogs,3000)};
}

// ─── Devices ───
async function fetchDevices(){
  try{
    const r=await fetch(API+'/devices');
    const d=await r.json();
    const list=document.getElementById('device-list');
    const devices=d.devices||[];
    document.getElementById('dev-count-header').textContent=devices.length;
    if(!devices.length){list.innerHTML='<div style="color:var(--dim);font-size:12px;padding:20px;text-align:center">No devices connected yet</div>';return}
    list.innerHTML=devices.map(dev=>`
      <div class="device">
        <div class="device-info">
          <span class="status-dot ${dev.connected?'on':'off'}"></span>
          <div>
            <div class="device-mac">${dev.device_id}</div>
            <div style="font-size:11px;color:var(--dim)">${dev.format} | ${dev.last_seen_ago}s ago</div>
          </div>
        </div>
        <span class="device-status ${dev.connected?'connected':'offline'}">${dev.connected?'Connected':'Offline'}</span>
      </div>
    `).join('');
  }catch(e){}
}

// ─── Config ───
async function fetchConfig(){
  try{
    const r=await fetch(API+'/config');
    const d=await r.json();
    document.getElementById('config-list').innerHTML=Object.entries(d).map(([k,v])=>`
      <div class="config-item">
        <span class="config-key">${k}</span>
        <span class="config-val">${typeof v==='object'?JSON.stringify(v):v}</span>
      </div>
    `).join('');
  }catch(e){}
}

// ─── Tools ───
async function fetchTools(){
  try{
    const r=await fetch(API+'/tools');
    const d=await r.json();
    const tools=d.tools||[];
    document.getElementById('tool-count').textContent=tools.length;
    document.getElementById('tool-list').innerHTML=tools.map(t=>`
      <div class="tool-item">
        <span class="tool-name">${t.function.name}</span>
        <span class="tool-desc">${t.function.description}</span>
      </div>
    `).join('')||'<div style="color:var(--dim);font-size:12px;padding:20px;text-align:center">No tools registered</div>';
  }catch(e){}
}

// ─── Tabs ───
function switchTab(el,id){
  el.parentElement.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  el.closest('.panel').querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id==='tab-tools')fetchTools();
}

// ─── Init ───
fetchHealth();fetchDevices();fetchConfig();connectLogs();
setInterval(fetchHealth,10000);setInterval(fetchDevices,5000);setInterval(()=>document.getElementById('uptime').textContent='uptime: '+uptime(),1000);
</script>
</body>
</html>
